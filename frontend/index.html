<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Placement Portal Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      :root {
        --ppa-ink: #10233a;
        --ppa-accent: #0f766e;
        --ppa-accent-2: #d97706;
        --ppa-surface: rgba(255, 255, 255, 0.9);
      }
      html, body {
        min-height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        color: var(--ppa-ink);
        background:
          radial-gradient(circle at top left, rgba(15, 118, 110, 0.12), transparent 30%),
          radial-gradient(circle at top right, rgba(217, 119, 6, 0.08), transparent 30%),
          linear-gradient(135deg, #f4f6f9 0%, #eef2f5 100%);
      }
      #app {
        width: 100%;
        max-width: 1100px;
        padding: 1rem;
      }
      .glass {
        background: var(--ppa-surface);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(16, 35, 58, 0.08);
        box-shadow: 0 12px 40px rgba(16, 35, 58, 0.08);
      }
      .hero {
        background: linear-gradient(135deg, #10233a 0%, #0f766e 100%);
        color: #fff;
        border-radius: 1.25rem;
        overflow: hidden;
      }
      .hero::after {
        content: '';
        display: block;
        height: 4px;
        background: linear-gradient(90deg, #d97706, #f59e0b, #eab308);
      }
      .small-muted { font-size: .85rem; color: #64748b; }
      .section-title { letter-spacing: 0.02em; text-transform: uppercase; font-size: .78rem; color: #567; }
      .table thead th { white-space: nowrap; }
      .hover-card {
        transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
      }
      .hover-card:hover {
        transform: translateY(-2px);
        background-color: rgba(255, 255, 255, 0.8) !important;
        border-color: var(--ppa-accent) !important;
        box-shadow: 0 4px 15px rgba(16, 35, 58, 0.05);
      }
      /* Custom Unified Theme Elements */
      .text-primary {
        color: var(--ppa-accent) !important;
      }
      .btn-primary {
        background-color: var(--ppa-accent) !important;
        border-color: var(--ppa-accent) !important;
        color: #fff !important;
      }
      .btn-primary:hover, .btn-primary:focus {
        background-color: #0c5e58 !important;
        border-color: #0c5e58 !important;
        color: #fff !important;
      }
      .btn-outline-primary {
        color: var(--ppa-accent) !important;
        border-color: var(--ppa-accent) !important;
      }
      .btn-outline-primary:hover, .btn-outline-primary:focus {
        background-color: var(--ppa-accent) !important;
        border-color: var(--ppa-accent) !important;
        color: #fff !important;
      }
      .badge.bg-primary {
        background-color: var(--ppa-accent) !important;
      }
    </style>
  </head>
  <body>
    <div id="app" class="container py-4"></div>
    <script type="module" src="/frontend/src/main.js"></script>
  </body>
</html>
